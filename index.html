<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jennifer Lamontagne | Photo Card</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, Arial, sans-serif;
        background: radial-gradient(
          circle at top,
          #dbeafe 0%,
          #93c5fd 45%,
          #2563eb 100%
        );
        color: #0f172a;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
      }

      .profile-card {
        width: min(420px, 100%);
        border-radius: 32px;
        overflow: hidden;
        box-shadow: 0 30px 70px rgba(15, 23, 42, 0.18);
        border: 1px solid rgba(255, 255, 255, 0.55);
        background: rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(14px);
      }

      .profile-header {
        padding: 28px 24px 20px;
        background: linear-gradient(
          135deg,
          #1d4ed8 0%,
          #60a5fa 55%,
          #bfdbfe 100%
        );
        color: white;
        display: grid;
        gap: 16px;
        text-align: center;
      }

      .profile-avatar {
        width: 108px;
        height: 108px;
        border-radius: 26px;
        object-fit: cover;
        border: 4px solid rgba(255, 255, 255, 0.95);
        margin: 0 auto;
        box-shadow: 0 18px 35px rgba(15, 23, 42, 0.22);
        background: white;
      }

      .profile-title {
        margin: 0;
        font-size: 1.5rem;
        letter-spacing: -0.02em;
      }

      .profile-subtitle {
        margin: 0;
        color: rgba(255, 255, 255, 0.9);
        font-size: 0.95rem;
        line-height: 1.5;
      }

      .profile-body {
        padding: 24px;
        display: grid;
        gap: 18px;
      }

      .profile-link {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        text-decoration: none;
        padding: 0.8rem 1rem;
        border-radius: 999px;
        background: #1d4ed8;
        color: white;
        font-weight: 700;
        width: fit-content;
        transition:
          transform 0.2s ease,
          background 0.2s ease;
      }

      .profile-link:hover {
        background: #1e40af;
        transform: translateY(-1px);
      }

      .profile-info {
        display: grid;
        gap: 14px;
      }

      .profile-info p {
        margin: 0;
        color: #475569;
        line-height: 1.7;
        font-size: 0.98rem;
      }

      .profile-info strong {
        color: #1d4ed8;
      }
    </style>
  </head>
  <body>
    <article class="profile-card">
      <div class="profile-header">
        <img
          class="profile-avatar"
          src="selfy image.jpg"
          alt="Jennifer Lamontagne"
        />
        <div>
          <h1 class="profile-title">Jennifer Lamontagne</h1>
          <p class="profile-subtitle">
            Visual storyteller with a love for warm, personal design.
          </p>
        </div>
      </div>
      <div class="profile-body">
        <a
          class="profile-link"
          href="https://github.com"
          target="_blank"
          rel="noopener noreferrer"
          >View GitHub</a
        >
        <div class="profile-info">
          <p><strong>Name:</strong> Jennifer Lamontagne</p>
          <p><strong>Role:</strong> Visual storyteller</p>
        </div>
      </div>
    </article>
  </body>
</html>
